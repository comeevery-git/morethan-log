<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 가 요청 하나를 처리하는 법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f1eadc; --surface:#fbf7ee; --surface2:#f4ecdc; --ink:#2b2621; --muted:#6b6256; --line:#ddd2bf;
  --accent:#c4de9f; --accent-ink:#27401a; --focus:#2f5fd0;
  --req:#e08a2e; --res:#4c9560; --apr:#4f74d6; --bad:#d0584a;
  --track:#b3a58d; --grid:#e3d8c4; --stroke:#2b2621; --shadow:#2b2621;
  --chip-problem-bg:#f7d4cd; --chip-problem-ink:#7a2a1f;
  --chip-tech-bg:#cfe0f7; --chip-tech-ink:#1d3f78;
  --chip-warn-bg:#f8e2b0; --chip-warn-ink:#6b4a05;
  --chip-sum-bg:#cfe8c4; --chip-sum-ink:#24501b;
  --call-key-bg:#e6dcf3; --call-key-ink:#3d2a63;
  --call-note-bg:#dcecd2; --call-note-ink:#26471a;
  --paper-t:#f1e9d8; --paper-l:#ddd1ba; --paper-r:#cfc2a8;
  --sand-t:#fffdf6; --sand-l:#ece3d0; --sand-r:#ddd2bb;
  --orange-t:#f3b56b; --orange-l:#e09a4a; --orange-r:#cc8438;
  --green-t:#a9d19a; --green-l:#86b877; --green-r:#6fa061;
  --blue-t:#9bb8ea; --blue-l:#7c9ad4; --blue-r:#6683bd;
  --dark-t:#58514a; --dark-l:#3b352f; --dark-r:#2c2823;
  --glass:#dfe9f2; --glass-line:#8aa0b8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16130e; --surface:#221e18; --surface2:#2b261e; --ink:#efe7d7; --muted:#aaa090; --line:#3b352b;
    --accent:#4f6e35; --accent-ink:#e8f4d6; --focus:#8fb0ff;
    --req:#f0a04b; --res:#6fbf85; --apr:#8aa6f5; --bad:#e8786a;
    --track:#6d6454; --grid:#2d281f; --stroke:#0c0a07; --shadow:#0c0a07;
    --chip-problem-bg:#5a2c25; --chip-problem-ink:#ffd5cd;
    --chip-tech-bg:#243d63; --chip-tech-ink:#d3e3fb;
    --chip-warn-bg:#5b4511; --chip-warn-ink:#ffe7b3;
    --chip-sum-bg:#2c5025; --chip-sum-ink:#d5efcb;
    --call-key-bg:#362b4c; --call-key-ink:#e4d8f7;
    --call-note-bg:#2a3f22; --call-note-ink:#d6ecc9;
    --paper-t:#4b443a; --paper-l:#3a342b; --paper-r:#2f2a23;
    --sand-t:#6a6150; --sand-l:#4f473a; --sand-r:#40392e;
    --orange-t:#dc9a50; --orange-l:#b97b37; --orange-r:#9c6529;
    --green-t:#6b9b5c; --green-l:#54814b; --green-r:#456b3e;
    --blue-t:#6c8ac6; --blue-l:#5571aa; --blue-r:#455f92;
    --dark-t:#9a9185; --dark-l:#766e63; --dark-r:#5f584e;
    --glass:#27323f; --glass-line:#5d7590;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}
button{font:inherit;color:inherit}
code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:232px minmax(0,1fr) 320px;gap:12px;height:100vh;padding:12px;max-width:1600px;margin:0 auto}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}

/* sidebar */
.side{padding:14px 12px;display:flex;flex-direction:column;min-height:0;overflow:auto}
.side-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.side-head b{font-size:16px}
.side-head .count{margin-left:auto;font-size:11px;color:var(--muted)}
.folder{width:18px;height:14px;background:var(--ink);border-radius:3px 3px 2px 2px;display:inline-block}
.chap{margin:2px 0}
.chap-row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-weight:600;font-size:13px;width:100%;background:none;border:0;text-align:left}
.chap-row .dot{width:16px;height:12px;border-radius:3px;flex:none}
.chap-row .badge{margin-left:auto;font-size:10px;font-weight:500;color:var(--muted)}
.lessons{margin:2px 0 4px 15px;padding-left:12px;border-left:1.5px solid var(--line);list-style:none}
.lesson{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.4;margin:1px 0}
.lesson .badge{margin-left:auto;flex:none;font-size:10px;color:var(--muted)}
.lesson.current{background:var(--accent);color:var(--accent-ink);font-weight:600;border:1.5px solid var(--stroke)}
.lesson[disabled],.chap-row[disabled]{opacity:.62;cursor:not-allowed}
.side-foot{margin-top:auto;padding-top:12px}
.prog{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;background:var(--surface2)}
.prog span:last-child{font-family:"JetBrains Mono",monospace}

/* header */
.head{padding:14px 18px 12px}
.crumb-row{display:flex;align-items:center;gap:10px}
.crumb{font-size:12px;color:var(--muted)}
.outline-btn{display:none;margin-left:auto;border:1.5px solid var(--stroke);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
h1{margin:4px 0 2px;font-size:24px;line-height:1.25;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:13px}
.badges{display:flex;gap:6px;position:absolute;right:18px;top:16px}
.head{position:relative}
.bdg{border:1.5px solid var(--stroke);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:600}
.bdg.b1{background:#f7dca8;color:#5b3d05}.bdg.b2{background:#cfe8c4;color:#24501b}.bdg.b3{background:#dcd0f2;color:#3d2a63}
@media (prefers-color-scheme: dark){.bdg.b1{background:#5b4511;color:#ffe7b3}.bdg.b2{background:#2c5025;color:#d5efcb}.bdg.b3{background:#362b4c;color:#e4d8f7}}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 12px 8px}
.stage-top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.tile{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 10px 6px;min-width:0}
.tile .k{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-family:"JetBrains Mono",monospace;font-size:17px;line-height:1.3;display:block}
.tile.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{background:var(--accent);transform:translateY(-2px)}100%{background:var(--surface2);transform:none}}
.ctrls{display:flex;gap:6px}
.btn{border:1.5px solid var(--stroke);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 0 var(--shadow)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--shadow)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.scene-wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;margin-top:6px}
.scene{display:block;width:100%;height:100%;min-height:200px}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;padding-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--stroke)}
.hint-scroll{display:none;font-size:11px;color:var(--muted)}

/* timeline */
.tl{padding:10px 14px 10px}
.tl-head{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.tl-list{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(8,1fr);position:relative}
.tl-list::before{content:"";position:absolute;left:var(--pad,6.25%);right:var(--pad,6.25%);top:13px;height:2px;background:var(--line)}
.tl-fill{position:absolute;left:var(--pad,6.25%);top:13px;height:2px;background:var(--stroke);width:0;transition:width .4s}
.tl-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.tl-item .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--stroke);background:var(--surface);font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;display:grid;place-items:center;position:relative;z-index:1}
.tl-item .l{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tl-item.done .n{background:var(--accent);color:var(--accent-ink)}
.tl-item.cur .n{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px var(--stroke)}
.tl-item.cur .l{color:var(--ink);font-weight:700}

/* panel */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px}
.panel-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.chip{border:1.5px solid var(--stroke);border-radius:8px;padding:0 9px;font-size:11px;font-weight:700;letter-spacing:.02em}
.chip.문제{background:var(--chip-problem-bg);color:var(--chip-problem-ink)}
.chip.기법{background:var(--chip-tech-bg);color:var(--chip-tech-ink)}
.chip.주의{background:var(--chip-warn-bg);color:var(--chip-warn-ink)}
.chip.정리{background:var(--chip-sum-bg);color:var(--chip-sum-ink)}
.panel-body{flex:1;min-height:0;overflow:auto;padding-right:2px}
.panel h2{margin:10px 0 6px;font-size:18px;line-height:1.35}
.panel p{margin:0 0 8px;font-size:13px;color:var(--ink)}
.panel code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11.5px}
.call{border:1.5px solid var(--stroke);border-radius:10px;padding:9px 11px;margin:10px 0;font-size:12.5px}
.call .cl{font-size:10px;letter-spacing:.08em;font-weight:700;display:block;margin-bottom:2px;opacity:.8}
.call.핵심{background:var(--call-key-bg);color:var(--call-key-ink)}
.call.알아{background:var(--call-note-bg);color:var(--call-note-ink)}
.changed h3{margin:8px 0 4px;font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.changed ul{margin:0;padding:0;list-style:none}
.changed li{font-size:12.5px;padding-left:20px;position:relative;margin:2px 0}
.changed li::before{content:"+";position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:4px;background:var(--call-note-bg);color:var(--call-note-ink);font-weight:700;font-size:11px;line-height:14px;text-align:center}
.nav{display:flex;gap:8px;margin-top:10px}
.nav .btn{padding:7px 12px}
.nav .next{flex:1;text-align:left;display:flex;justify-content:space-between;gap:6px}
.keys{margin-top:8px;font-size:11px;color:var(--muted);text-align:center}
kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface2)}
.learn{padding:12px 16px}
.learn h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.learn ul{list-style:none;margin:0;padding:0}
.learn li{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin:4px 0;line-height:1.4}
.learn .bx{flex:none;width:15px;height:15px;border:1.5px solid var(--stroke);border-radius:4px;margin-top:1px;display:grid;place-items:center;font-size:11px;line-height:1;font-weight:700}
.learn li.on .bx{background:var(--accent);color:var(--accent-ink)}
.learn li:not(.on){color:var(--muted)}

.lesson:not([disabled]){cursor:pointer}
.lesson:not([disabled]):not(.current):hover{background:var(--surface2)}
/* svg scene */
.cell rect{fill:var(--surface);stroke:var(--stroke);stroke-width:1.6;transition:fill .3s}
.cell text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;font-weight:700;fill:var(--ink)}
.cell.done rect{fill:var(--accent)}
.cell.cur rect{fill:var(--orange-t);stroke-width:2.6}
.cell.cur text{fill:#2b1a05}
.chp{stroke:var(--stroke);stroke-width:1.2;fill:var(--surface2)}
.chp.진행{fill:var(--chip-warn-bg)}.chp.PR,.chp.테스트{fill:var(--chip-tech-bg)}.chp.인간{fill:var(--chip-problem-bg)}.chp.완료{fill:var(--chip-sum-bg)}
.envp .hl{opacity:0;transition:opacity .4s}.envp.act .hl{opacity:1}
.gridbg{fill:url(#isogrid)}
.bx polygon{stroke:var(--stroke);stroke-width:1.6;stroke-linejoin:round}
.obj{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.obj.on{opacity:1;transform:none}
.obj.on.dim{opacity:.32;filter:grayscale(.8)}
.pill rect{fill:var(--surface);stroke:var(--stroke);stroke-width:1.6}
.pill text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;font-weight:600;fill:var(--ink)}
.pill.mono text{font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:500}
.pill.hot rect{fill:#f9dcb4}.pill.hot text{fill:#4b2c05}
.pill.ok rect{fill:#cfe8c4}.pill.ok text{fill:#1f4a17}
.pill.bad rect{fill:#f5cdc6}.pill.bad text{fill:#6e2118}
.pill.chg rect{fill:#cfe8c4}.pill.chg text{fill:#1f4a17}
.pill.lit rect{fill:#f9dcb4}.pill.lit text{fill:#4b2c05}
@media (prefers-color-scheme: dark){
  .pill.hot rect{fill:#5d4118}.pill.hot text{fill:#ffe2b8}
  .pill.ok rect,.pill.chg rect{fill:#2c5025}.pill.ok text,.pill.chg text{fill:#d5efcb}
  .pill.bad rect{fill:#5a2c25}.pill.bad text{fill:#ffd5cd}
  .pill.lit rect{fill:#5d4118}.pill.lit text{fill:#ffe2b8}
}
.pill.off{opacity:.0}
.cardsvg .sh{fill:var(--stroke);opacity:.9}
.cardsvg .bg{fill:var(--surface);stroke:var(--stroke);stroke-width:1.6}
.cardsvg text{font-size:12px;fill:var(--ink)}
.cardsvg .tt{font-size:13px;font-weight:700}
.cardsvg .mo{font-family:"JetBrains Mono",monospace;font-size:11.5px}
.cardsvg .mu{fill:var(--muted);font-size:11px}
.cardsvg .opt{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.cardsvg .opt.pick{fill:var(--accent);stroke:var(--stroke);stroke-width:1.6}
.cardsvg .dl{fill:#f6cfc8}.cardsvg .al{fill:#cfe8c4}
@media (prefers-color-scheme: dark){.cardsvg .dl{fill:#5a2c25}.cardsvg .al{fill:#2c5025}}
.cardsvg.ghost .bg{fill:none;stroke-dasharray:6 5;stroke:var(--bad)}
.cardsvg.ghost .sh{display:none}
.cardsvg.ghost text{fill:var(--bad)}
.trk{fill:none;stroke:var(--track);stroke-width:2.2;stroke-dasharray:2 7;stroke-linecap:round;opacity:0;transition:opacity .4s}
.trk.on{opacity:1}
.trk.blocked{stroke:var(--bad);stroke-dasharray:7 6}
.dot{stroke:#fff;stroke-width:2}
.dot.req{fill:var(--req)}.dot.res{fill:var(--res)}.dot.apr{fill:var(--apr)}
.lamp{fill:#9a9488;stroke:var(--stroke);stroke-width:1.5}
.st-run .lamp{fill:#e8b030}.st-fail .lamp{fill:#d0584a}.st-pass .lamp{fill:#4cb06a}
.cursor{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.ov{fill:var(--req);fill-opacity:0;stroke:none;transition:fill-opacity .3s}
.fl.lit .ov{fill-opacity:.6}
.fl.chg .ov{fill:var(--res);fill-opacity:.65}
.match polygon{stroke:var(--req);stroke-width:2.6}
.xmark{stroke:var(--bad);stroke-width:4;stroke-linecap:round}
.xbg{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.chipsvg rect{fill:var(--surface);stroke:var(--stroke);stroke-width:1.6}
.chipsvg text{font-size:13px;font-weight:700;fill:var(--ink)}
.chev{fill:none;stroke:var(--stroke);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion: reduce){
  .obj,.trk,.ov,.tl-fill{transition:none}
  .tile.pulse{animation:none}
  .cursor{animation:none}
}

@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto;padding:10px;gap:10px}
  .side{display:none;max-height:none}
  .side.open{display:flex}
  .outline-btn{display:inline-block}
  .badges{position:static;margin-top:8px;flex-wrap:wrap}
  h1{font-size:20px}
  .stage{min-height:0}
  .scene-wrap{flex:none;overflow-x:auto;height:auto}
  .scene{width:760px;height:auto;min-height:0;aspect-ratio:960/600}
  .hint-scroll{display:block}
  .col{display:contents}
  .center-col{display:flex;flex-direction:column;gap:10px}
  .panel{flex:none}
  .panel-body{overflow:visible}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;flex-basis:100%}
  .tile{padding:4px 6px}
  .tile .k{font-size:9.5px}
  .tile b{font-size:14px}
  .tl-item .l{font-size:10px}
  .tl-item .n{width:26px;height:26px}
  .tl-list::before,.tl-fill{top:12px}
}

/* engine additions */
.obj.on.emph{filter:drop-shadow(0 0 7px var(--req))}
.cardsvg .warn{fill:var(--bad)}
.cardsvg .bold{font-weight:700}
.cardsvg .ctr{text-anchor:middle}
.gt .g-open{display:none}.gt.open .g-open{display:block}.gt.open .g-closed{display:none}
.side-empty{display:none}

</style>
</head>
<body>
<div class="app">
  <aside class="side card" id="side" aria-label="강의 목차">
    <div class="side-head"><span class="folder" aria-hidden="true"></span><b id="courseTitle"></b><span class="count" id="courseCount"></span></div>
    <nav id="courseNav"></nav>
    <div class="side-foot"><div class="prog"><span>진행</span><span id="prog"></span></div></div>
  </aside>

  <div class="col center-col">
    <header class="head card">
      <div class="crumb-row"><span class="crumb" id="crumb"></span><button class="outline-btn" id="outlineBtn" type="button" aria-expanded="false" aria-controls="side">목차</button></div>
      <h1 id="h1t"></h1>
      <p class="sub" id="subt"></p>
      <div class="badges" id="bdgs"></div>
    </header>

    <section class="stage card" aria-label="시각화 무대">
      <div class="stage-top">
        <div class="tiles" id="tiles"></div>
        <div class="ctrls">
          <button class="btn" id="replay" type="button">다시 재생</button>
          <button class="btn" id="pause" type="button" aria-pressed="false">멈춤</button>
        </div>
      </div>
      <div class="scene-wrap"><svg class="scene" id="scene" viewBox="0 0 960 600" role="img" aria-label="" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="legend"><span><i style="background:var(--req)"></i>요청</span><span><i style="background:var(--res)"></i>응답</span><span><i style="background:var(--apr)"></i>승인</span><span id="legNote"></span><span class="hint-scroll">그림은 좌우로 밀어서 볼 수 있어요</span></div>
    </section>

    <nav class="tl card" aria-label="이 레슨에서">
      <div class="tl-head"><span>이 레슨에서</span><span id="tlCount"></span></div>
      <ol class="tl-list" id="tlList"><div class="tl-fill" id="tlFill"></div></ol>
    </nav>
  </div>

  <div class="col right-col">
    <section class="panel card" aria-label="단계 설명">
      <div class="panel-top"><span id="stepLabel"></span><span class="chip" id="chip"></span></div>
      <div class="panel-body" id="panelBody"></div>
      <div class="nav">
        <button class="btn" id="back" type="button">이전</button>

    var from=o._v==null?(o.value||0):o._v;
    function draw(v){o._v=v; var f=dom('e-'+o.id+'--fill'); if(f) f.innerHTML=towerFill(o,v);
      var t=dom('e-'+o.id+'--v'); if(t){t.querySelector('text').textContent=Math.round(v)+'%'; fitPill(t);}}
    if(!ctx.animate||reduce||from===p.value){draw(p.value);return;}
    tween(o.id,from,p.value,draw);
  }},
 person:{render:function(o,e){
    var c=g2s(o.at), x=c[0], y=c[1];
    return '<g id="'+e+'">'+box(x,y,110,100,10,'paper').svg+box(x,y-10,26,26,36,'blue').svg+box(x,y-46,18,18,18,'sand').svg+'</g>'+labelOf(e,o,c,[0,77]);
  }},
 phone:{render:function(o,e){
    var c=g2s(o.at), b=box(c[0],c[1],14,14,24,'dark'), q=lq(b.lf,.15,.85,.2,.8);
    return '<g id="'+e+'">'+b.svg+'<polygon points="'+pts(q)+'" style="fill:var(--glass);stroke:var(--glass-line);stroke-width:1"/></g>';
  }},
 gate:{
  render:function(o,e){
    var c=g2s(o.at), x=c[0], y=c[1];
    return '<g class="gt'+(o.open?' open':'')+'" id="'+e+'"><g class="g-closed">'+box(x,y,10,70,44,'orange').svg+'</g><g class="g-open">'+
      box(x,y-32,10,10,36,'green').svg+box(x,y+32,10,10,36,'green').svg+'</g></g>'+
      pillSvg(e+'--label',x,y-96,o.open?o.labelOpen:o.labelClosed,o.open?'ok':'hot');
  },
  set:function(o,p){
    if(p.open==null) return;
    var g=dom('e-'+o.id); if(g) g.classList.toggle('open',!!p.open);
    var l=dom('e-'+o.id+'--label');
    if(l){l.querySelector('text').textContent=p.open?o.labelOpen:o.labelClosed; l.setAttribute('class','pill '+(p.open?'ok':'hot')); fitPill(l);}
  }},
 'test-box':{
  render:function(o,e){
    var c=g2s(o.at), x=c[0], y=c[1], pl=box(x,y,120,90,8,'paper'), dv=box(x,y-8,66,48,34,'dark');
    var sq=lq(dv.lf,.14,.86,.18,.82), cx=(sq[0][0]+sq[2][0])/2, cy=(sq[0][1]+sq[2][1])/2;
    return '<g class="tb st-idle" id="'+e+'">'+pl.svg+dv.svg+'<polygon points="'+pts(sq)+'" style="fill:var(--glass);stroke:var(--glass-line);stroke-width:1.2"/><ellipse class="lamp" cx="'+cx+'" cy="'+cy+'" rx="8" ry="8"/></g>'+
      pillSvg(e+'--status',x,y-97,o.status||'','')+pillSvg(e+'--label',x+115,y,o.label||'','',true);
  },
  set:function(o,p){
    if(!p.lamp) return; var g=dom('e-'+o.id); if(g) g.setAttribute('class','tb st-'+p.lamp);
  }},
 'board-strip':{
  render:function(o,e){
    var p=pos(o), L=o.labels, w=o.cellW||100, gap=o.gap||12, h=o.h||36, out='';
    L.forEach(function(t,i){var x=p[0]+i*(w+gap);
      out+='<g class="cell" id="'+e+'--c'+i+'"><rect x="'+x+'" y="'+p[1]+'" width="'+w+'" height="'+h+'" rx="10"/><text x="'+(x+w/2)+'" y="'+(p[1]+h/2+5)+'" text-anchor="middle">'+esc(t)+'</text></g>';});
    return '<g id="'+e+'">'+out+'</g>'+(o.title?pillSvg(e+'--title',p[0]-66,p[1]+h/2,o.title,''):'');
  },
  set:function(o,p){
    if(p.cur==null) return;
    for(var i=0;i<o.labels.length;i++){var g=dom('e-'+o.id+'--c'+i); if(g){g.classList.toggle('done',i<p.cur);g.classList.toggle('cur',i===p.cur);}}
  }},
 'chip-row':{render:function(o,e){
    var p=pos(o), w=o.chipW||60, out='', n=o.labels.length;
    o.labels.forEach(function(t,i){
      var cx=p[0]+i*o.pitch;
      out+='<g class="chipsvg" transform="translate('+cx+' '+p[1]+')"><rect x="'+(-w/2)+'" y="-14" width="'+w+'" height="28" rx="14"/><text y="5" text-anchor="middle">'+esc(t)+'</text></g>';
      if(o.chev&&i<n-1){var a=cx+w/2+6; out+='<path class="chev" d="M '+a+' '+(p[1]-6)+' L '+(a+6)+' '+p[1]+' L '+a+' '+(p[1]+6)+'"/>';}
    });
    return '<g id="'+e+'">'+out+'</g>';
  }},
 xmark:{render:function(o,e){var p=pos(o);return '<g id="'+e+'" transform="translate('+p[0]+' '+p[1]+')"><circle class="xbg" r="13"/><path class="xmark" d="M-5 -5 L5 5 M5 -5 L-5 5"/></g>';}}
};
function towerFill(o,v){
  if(v<=0.2) return '';
  var c=g2s(o.at), s=o.size||[34,34];
  return box(c[0],c[1],s[0],s[1],Math.max(1,v*(o.maxH||100)/100),o.fill||'orange').svg;
}
function fitPill(g){
  var t=g.querySelector('text'), r=g.querySelector('rect'), w=t.getComputedTextLength?t.getComputedTextLength():0;
  if(!w){w=t.getBBox().width;}
  r.setAttribute('width',(w+24).toFixed(1)); r.setAttribute('x',(-(w+24)/2).toFixed(1));
}

/* engine.js: reads window.__LESSONS__ and window.__COURSE__, draws everything from data. */
var LESSONS=window.__LESSONS__, COURSE=window.__COURSE__, byId={};
LESSONS.forEach(function(L){byId[L.id]=L;});
var svg=document.getElementById('scene'), $=dom;
var st={lesson:'',step:1,paused:false,t:0,events:[],flows:[]};
var cur=null, ctx={objs:{},animate:false,tween:tween};
var CYCLE=2800, TRAVEL=1200;

function inRange(spec,n){
  if(spec==null) return false;
  return String(spec).split(',').some(function(r){var m=r.split('-'),a=+m[0],b=m.length>1?+m[1]:a;return n>=a&&n<=b;});
}
function firstOf(spec){return +String(spec).split(',')[0].split('-')[0];}
function md(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>');}
function at(ms,fn){if(reduce){fn();}else{st.events.push({t:ms,fn:fn,done:false});}}

/* ---------- scene ---------- */
function reg(o){ctx.objs[o.id]=o;(o.children||[]).forEach(reg);}
function ptOf(p,off){
  var a=typeof p==='string'?pos(ctx.objs[p]):p;
  return off?[a[0]+off[0],a[1]+off[1]]:a;
}
function pathD(p){
  var a=ptOf(p.from,p.fromOff), b=ptOf(p.to,p.toOff), s='M '+a[0]+' '+a[1];
  if(p.via2) return s+' C '+p.via2[0][0]+' '+p.via2[0][1]+' '+p.via2[1][0]+' '+p.via2[1][1]+' '+b[0]+' '+b[1];
  if(p.via) return s+' Q '+p.via[0]+' '+p.via[1]+' '+b[0]+' '+b[1];
  return s+' L '+b[0]+' '+b[1];
}
function buildScene(L,n){
  ctx.objs={}; L.objects.forEach(reg);
  var out=['<defs><pattern id="isogrid" width="60" height="34.64" patternUnits="userSpaceOnUse"><path d="M0 0 L60 34.64 M60 0 L0 34.64" stroke="var(--grid)" stroke-width="1" fill="none"/></pattern>'+
    '<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="context-stroke"/></marker></defs>',
    '<rect class="gridbg" width="960" height="600" rx="12"/>'];
  var step=L.steps[n-1], idx=0, emph=step.emph||[];
  var over=[];
  L.objects.forEach(function(o){
    var vis=o.show==null||inRange(o.show,n), dim=!vis&&inRange(o.dim,n), isNew=vis&&o.show!=null&&firstOf(o.show)===n;
    var em=vis&&(inRange(o.emph,n)||emph.indexOf(o.id)>=0);
    var cls='obj'+((vis&&!isNew)||dim?' on':'')+(dim?' dim':'')+(em?' emph':'');
    o._new=isNew?idx++:-1;
    (o.over?over:out).push('<g class="'+cls+'" id="o-'+o.id+'">'+LIB[o.type].render(o,'e-'+o.id)+'</g>');
  });
  var tr='<g id="tracks">';
  (L.paths||[]).forEach(function(p){tr+='<path class="trk" id="t-'+p.id+'" d="'+pathD(p)+'" marker-end="url(#arr)"/>';});
  return out.join('')+tr+'</g><g id="dots"></g>'+over.join('');
}
function fitAll(){Array.prototype.forEach.call(svg.querySelectorAll('.pill'),fitPill);}

function setPart(id,p){
  var el=dom(id); if(!el) return;
  if(p.text!=null){
    var t=el.tagName==='text'?el:el.querySelector('text'); if(t) t.textContent=p.text;
    if(el.classList.contains('pill')) fitPill(el);
  }
  if('tone' in p){
    var tn=p.tone?' '+p.tone:'';
    if(el.getAttribute('data-self')) el.setAttribute('class',(el.getAttribute('data-base')||'')+tn);
    else if(el.tagName==='g'){var r=el.querySelector('rect'); r.setAttribute('class',(r.getAttribute('data-base')||'')+tn);}
    else el.setAttribute('class',(el.getAttribute('data-base')||'')+tn);
  }
}
function applySet(map,animate){
  if(!map) return;
  ctx.animate=animate;
  Object.keys(map).forEach(function(k){
    var a=k.split('.'), o=ctx.objs[a[0]], p=map[k];
    if(!o) return;
    if(a[1]){setPart('e-'+a[0]+'--'+a[1],p);return;}
    var lib=LIB[o.type]; if(lib.set) lib.set(o,p,ctx);
    if(o.type==='pill') setPart('e-'+o.id,p);
  });
}
function syncFlows(fl){
  var used={}, blocked={};
  fl.forEach(function(f){used[f.path]=true; if(f.blocked) blocked[f.path]=true;});
  Array.prototype.forEach.call(svg.querySelectorAll('.trk'),function(p){
    var id=p.id.slice(2); p.classList.toggle('on',!!used[id]); p.classList.toggle('blocked',!!blocked[id]);
  });
  var dg=$('dots'); dg.innerHTML=''; st.flows=[];
  if(reduce) return;
  fl.forEach(function(f){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('r','6.5'); c.setAttribute('class','dot '+f.kind); c.setAttribute('opacity','0'); dg.appendChild(c);
    var path=$('t-'+f.path); st.flows.push({el:c,path:path,len:path.getTotalLength(),d:f.delay||0,stop:f.stop||1});
  });
}
function setMetrics(arr,quiet){
  var tiles=document.querySelectorAll('.tile');
  arr.forEach(function(v,i){
    var b=tiles[i].querySelector('b');
    if(b.textContent!==v){
      b.textContent=v;
      if(!quiet&&!reduce){tiles[i].classList.remove('pulse');void tiles[i].offsetWidth;tiles[i].classList.add('pulse');}
    }
  });
}
function blank(L){return L.tiles.map(function(){return '-';});}

function applyScene(L,n){
  var step=L.steps[n-1], k;
  TICK=[];
  for(k=1;k<n;k++){
    var ps=L.steps[k-1]; applySet(ps.set,false);
    (ps.timeline||[]).forEach(function(ev){applySet(ev.set,false);});
  }
  applySet(step.set,true);
  fitAll();
  L.objects.forEach(function(o){
    if(o._new<0) return;
    var el=$('o-'+o.id); at(120+o._new*160,function(){el.classList.add('on');});
  });
  syncFlows(step.flows||[]);
  setMetrics(n>1?L.steps[n-2].metrics:blank(L),true);
  var seq=false;
  (step.timeline||[]).forEach(function(ev){
    if(ev.metrics) seq=true;
    at(ev.t,function(){applySet(ev.set,true); if(ev.metrics) setMetrics(ev.metrics);});
  });
  if(!seq) at(250,function(){setMetrics(step.metrics);});
}

/* ---------- panel, timeline, learn ---------- */
function renderTimeline(){
  var ol=$('tlList'), fill=$('tlFill'), N=cur.steps.length, pad=50/N;
  Array.prototype.forEach.call(ol.querySelectorAll('li'),function(li){ol.removeChild(li);});
  ol.style.gridTemplateColumns='repeat('+N+',1fr)'; ol.style.setProperty('--pad',pad.toFixed(2)+'%');
  cur.steps.forEach(function(s,i){
    var n=i+1, li=document.createElement('li'), b=document.createElement('button');
    li.style.display='contents'; b.type='button';
    b.className='tl-item'+(n<st.step?' done':'')+(n===st.step?' cur':'');
    b.setAttribute('aria-label','단계 '+n+', '+s.title);
    if(n===st.step) b.setAttribute('aria-current','step');
    b.innerHTML='<span class="n">'+n+'</span><span class="l">'+esc(s.tl)+'</span>';
    b.addEventListener('click',function(){go(n);});
    li.appendChild(b); ol.appendChild(li);
  });
  fill.style.width=((st.step-1)/(N-1)*(100-2*pad)).toFixed(2)+'%';
  $('tlCount').textContent='단계 '+st.step+' / '+N;
}
function renderPanel(){
  var s=cur.steps[st.step-1], N=cur.steps.length;
  $('stepLabel').textContent='STEP '+st.step+' / '+N;
  var chip=$('chip'); chip.textContent=s.tag; chip.className='chip '+s.tag;
  var ck=s.callout.kind==='핵심'?'핵심':'알아';
  $('panelBody').innerHTML='<h2>'+md(s.title)+'</h2>'+s.body.map(function(t){return '<p>'+md(t)+'</p>';}).join('')+
    '<div class="call '+ck+'"><span class="cl">'+esc(s.callout.kind)+'</span>'+md(s.callout.text)+'</div>'+
    '<div class="changed"><h3>바뀐 것</h3><ul>'+s.changed.map(function(t){return '<li>'+md(t)+'</li>';}).join('')+'</ul></div>';
  $('panelBody').scrollTop=0;
  $('back').disabled=st.step===1;
  var nx=$('next');
  if(st.step<N){nx.disabled=false;$('nextLabel').textContent='다음: '+cur.steps[st.step].nav;}
  else{var nl=nextLesson();
    if(nl&&nl.live){nx.disabled=false;$('nextLabel').textContent='다음 레슨: '+nl.title;}
    else{nx.disabled=true;$('nextLabel').textContent=nl?'다음 레슨 (준비 중)':'코스 끝';}}
}
function renderLearn(){
  $('learn').innerHTML=cur.learn.map(function(l){
    var on=st.step>=l.step;
    return '<li class="'+(on?'on':'')+'"><span class="bx" aria-hidden="true">'+(on?'&#10003;':'')+'</span><span>'+md(l.text)+(on?'<span class="sr"> (완료)</span>':'')+'</span></li>';
  }).join('');
}

/* ---------- course sidebar ---------- */
function renderSidebar(){
  $('courseTitle').textContent=COURSE.title; $('courseCount').textContent=COURSE.chapters.length+'개 챕터';
  var h='';
  COURSE.chapters.forEach(function(c){
    var dot='<span class="dot" style="background:'+c.color+'"></span>';
    if(!c.lessons){h+='<div class="chap"><button class="chap-row" type="button" disabled>'+dot+esc(c.n+' '+c.name)+'<span class="badge">준비 중</span></button></div>';return;}
    var live=c.lessons.filter(function(l){return l.id&&byId[l.id];}).length;
    h+='<div class="chap"><div class="chap-row">'+dot+esc(c.n+' '+c.name)+'<span class="badge">'+live+'/'+c.lessons.length+'</span></div><ul class="lessons">';
    c.lessons.forEach(function(l){
      if(l.id&&byId[l.id]) h+='<li><button class="lesson" type="button" data-lesson="'+l.id+'">'+esc(l.title)+'</button></li>';
      else h+='<li><button class="lesson" type="button" disabled>'+esc(l.title)+'<span class="badge">준비 중</span></button></li>';
    });
    h+='</ul></div>';
  });
  $('courseNav').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.lesson[data-lesson]'),function(b){
    b.addEventListener('click',function(){
      var l=b.getAttribute('data-lesson');
      if(l!==st.lesson){location.hash='#'+l+'-step-1'; enter(l,1,false);}
      $('side').classList.remove('open'); $('outlineBtn').setAttribute('aria-expanded','false');
    });
  });
}

/* ---------- control ---------- */
function mount(lid){
  cur=byId[lid]; st.lesson=lid;
  $('tiles').innerHTML=cur.tiles.map(function(t){return '<div class="tile"><span class="k">'+esc(t)+'</span><b>-</b></div>';}).join('');
  $('crumb').textContent=cur.crumb; $('h1t').textContent=cur.title; $('subt').textContent=cur.subtitle;
  var bc=['b1','b2','b3'];
  $('bdgs').innerHTML=cur.badges.map(function(t,i){return '<span class="bdg '+bc[i]+'">'+esc(t)+'</span>';}).join('');
  $('legNote').textContent=cur.legend;
  document.title=cur.title;
  Array.prototype.forEach.call(document.querySelectorAll('.lesson[data-lesson]'),function(b){
    var on=b.getAttribute('data-lesson')===lid; b.classList.toggle('current',on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
function setPaused(p){
  st.paused=p; var b=$('pause'); b.textContent=p?'재생':'멈춤'; b.setAttribute('aria-pressed',p?'true':'false');
}
function enter(lid,n,replay){
  if(lid!==st.lesson) mount(lid);
  var N=cur.steps.length;
  st.step=n; st.t=0; st.events=[]; setPaused(false);
  renderPanel(); renderTimeline(); renderLearn();
  $('prog').textContent=n+' / '+N;
  svg.innerHTML=buildScene(cur,n);
  svg.setAttribute('aria-label',cur.steps[n-1].alt);
  applyScene(cur,n);
  $('live').textContent='STEP '+n+' / '+N+', '+cur.steps[n-1].tag+', '+cur.steps[n-1].title;
}
function go(n){
  n=Math.max(1,Math.min(cur.steps.length,n));
  if(n===st.step) return;
  var h='#'+st.lesson+'-step-'+n;
  if(location.hash!==h){location.hash=h;}
  enter(st.lesson,n,false);
}
/* 코스 순서에서 지금 레슨 바로 다음 레슨. 없으면 null */
function nextLesson(){
  var flat=[];
  COURSE.chapters.forEach(function(c){(c.lessons||[]).forEach(function(l){flat.push(l);});});
  for(var i=0;i<flat.length;i++){
    if(flat[i].id===st.lesson){var l=flat[i+1]; return l?{id:l.id,title:l.title,live:!!(l.id&&byId[l.id])}:null;}
  }
  return null;
}
function forward(){
  if(st.step<cur.steps.length){go(st.step+1);return;}
  var nl=nextLesson();
  if(nl&&nl.live){location.hash='#'+nl.id+'-step-1'; enter(nl.id,1,false);}
}
function parseHash(){
  var h=location.hash, m=/^#(.+)-step-(\d+)$/.exec(h);
  if(m&&byId[m[1]]){var k=+m[2]; return {l:m[1],n:k>=1&&k<=byId[m[1]].steps.length?k:1};}
  m=/^#step-(\d+)$/.exec(h);
  var first=COURSE.legacy||LESSONS[0].id;
  return m&&+m[1]>=1&&+m[1]<=byId[first].steps.length?{l:first,n:+m[1]}:{l:first,n:1};
}

$('next').addEventListener('click',forward);
$('back').addEventListener('click',function(){go(st.step-1);});
$('replay').addEventListener('click',function(){enter(st.lesson,st.step,true);});
$('pause').addEventListener('click',function(){setPaused(!st.paused);});
$('outlineBtn').addEventListener('click',function(){
  var s=$('side'), o=s.classList.toggle('open'); this.setAttribute('aria-expanded',o?'true':'false');
});
window.addEventListener('hashchange',function(){var p=parseHash(); if(p.l!==st.lesson||p.n!==st.step) enter(p.l,p.n,false);});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){e.preventDefault();forward();}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(st.step-1);}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();enter(st.lesson,st.step,true);}
  else if(e.key===' '||e.code==='Space'){e.preventDefault();setPaused(!st.paused);}
});
document.addEventListener('keyup',function(e){if(e.key===' '||e.code==='Space'){e.preventDefault();}});

/* ---------- frame loop ---------- */
var last=0;
function frame(ts){
  if(!last) last=ts;
  var dt=Math.min(64,ts-last); last=ts;
  if(!st.paused){
    st.t+=dt;
    st.events.forEach(function(e){if(!e.done&&st.t>=e.t){e.done=true;e.fn();}});
    tickAll(dt);
    st.flows.forEach(function(f){
      var ph=st.t-f.d; if(ph<0){f.el.setAttribute('opacity','0');return;}
      ph=ph%CYCLE;
      if(ph>TRAVEL){f.el.setAttribute('opacity','0');return;}
      var p=ph/TRAVEL, lim=f.stop;
      if(p>lim){f.el.setAttribute('opacity','0');return;}
      var pt=f.path.getPointAtLength(f.len*p);
      f.el.setAttribute('cx',pt.x.toFixed(1)); f.el.setAttribute('cy',pt.y.toFixed(1));
      f.el.setAttribute('opacity',Math.max(0,Math.min(1,Math.min(p*8,(lim-p)*8+0.2))).toFixed(2));
    });
  }
  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
renderSidebar();
var p0=parseHash(), h0='#'+p0.l+'-step-'+p0.n;
if(location.hash!==h0){history.replaceState(null,'',h0);}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fitAll();});}
enter(p0.l,p0.n,false);
requestAnimationFrame(frame);

})();
</script>
